<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mox Tools</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    
    <meta name="description" content="Mox Tools — независимый разработчик утилит и игр. Создаем инструменты для профессионалов и развлечения для души.">
</head>
<body>

    <!-- Контейнеры для вставки -->
    <div id="site-header"></div>

    <main class="main-content">
        
        <section class="hero">
            <div class="hero-container">
                <div class="hero-text">
                    <h1 class="hero-title">Mox Tools</h1>
                    <p class="hero-subtitle">Инструменты для работы. Игры для отдыха.</p>
                    <div class="hero-buttons">
                        <a href="games.html" class="btn btn-primary">Наши игры</a>
                        <a href="utilities.html" class="btn btn-outline">Наши утилиты</a>
                    </div>
                </div>
                <div class="hero-visual">
                    <img src="img/hero-placeholder.png" alt="Продукты Mox Tools" class="hero-img">
                </div>
            </div>
        </section>

        <section class="releases">
            <div class="container">
                <h2 class="section-title">Свежие релизы</h2>
                <div class="releases-grid">
                    
                    <article class="release-card game-card">
                        <a href="#" class="release-link">
                            <div class="release-image">
                                <img src="img/game-thumb-1.jpg" alt="Обложка игры 1">
                                <span class="release-badge">Игра</span>
                            </div>
                            <div class="release-body">
                                <h3 class="release-name">Название игры</h3>
                                <p class="release-desc">Короткое описание проекта.</p>
                            </div>
                        </a>
                    </article>

                    <article class="release-card utility-card">
                        <a href="#" class="release-link">
                            <div class="release-image">
                                <img src="img/util-thumb-1.jpg" alt="Превью утилиты">
                                <span class="release-badge">Утилита</span>
                            </div>
                            <div class="release-body">
                                <h3 class="release-name">Название утилиты</h3>
                                <p class="release-desc">Короткое описание инструмента.</p>
                            </div>
                        </a>
                    </article>

                    <article class="release-card update-card">
                        <a href="#" class="release-link">
                            <div class="release-image">
                                <img src="img/update-thumb.jpg" alt="Логотип обновления">
                                <span class="release-badge">Обновление</span>
                            </div>
                            <div class="release-body">
                                <h3 class="release-name">Mox Engine v2.0</h3>
                                <p class="release-desc">Крупное обновление нашего движка.</p>
                            </div>
                        </a>
                    </article>

                </div>
                <div class="releases-actions">
                    <a href="catalog.html" class="btn btn-outline">Весь каталог</a>
                </div>
            </div>
        </section>

    </main>

    <div id="site-footer"></div>

    <!-- Подключаем скрипт сборки -->
    <script src="incfah.js" defer></script>

</body>
</html>
